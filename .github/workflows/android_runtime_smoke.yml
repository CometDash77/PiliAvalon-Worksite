name: Android Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful signed Build run containing the APK artifact"
        required: true
        type: string
      harness_ref:
        description: "Branch, tag, or commit containing the runtime smoke harness (defaults to the dispatched ref)"
        required: false
        default: ""
        type: string
      apk_variant:
        description: "Signed APK variant to install on the x86_64 emulator"
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - universal
      package_name:
        description: "Android package name to launch"
        required: true
        default: "com.example.piliplus"
        type: string
      runtime_smoke_scenario:
        description: "Optional scenario tag (e.g. recommend-detail-tag-shielding)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  runtime-smoke:
    name: Install and launch APK on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      HARNESS_REF: ${{ inputs.harness_ref || github.ref }}
      APK_VARIANT: ${{ inputs.apk_variant || 'x86_64' }}
      PACKAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.package_name || 'com.example.piliplus' }}
      RUNTIME_SMOKE_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_smoke_scenario || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.harness_ref || github.sha }}

      - name: Record harness revision
        run: |
          mkdir -p runtime-smoke/evidence
          git rev-parse HEAD | tee runtime-smoke/evidence/harness-sha.txt
          echo "harness_ref=${HARNESS_REF}" > runtime-smoke/evidence/harness-ref.txt

      - name: Download selected signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          case "$APK_VARIANT" in
            x86_64|universal) ;;
            *) echo "Unsupported APK variant: $APK_VARIANT" >&2; exit 1 ;;
          esac
          mkdir -p runtime-smoke/apk runtime-smoke/evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" > runtime-smoke/evidence/build-run.json
          jq -e '.path == ".github/workflows/build.yml" and .conclusion == "success"' runtime-smoke/evidence/build-run.json
          jq -r '.head_sha' runtime-smoke/evidence/build-run.json > runtime-smoke/evidence/build-sha.txt
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/artifacts" |
            jq -er --arg suffix "_${APK_VARIANT}.apk" '
              [.artifacts[] | select(.expired == false and (.name | endswith($suffix)))] |
              if length == 1 then .[0] | [.id, .name] | @tsv
              else error("Expected exactly one nonexpired APK artifact for the selected variant") end
            ' > runtime-smoke/apk/artifact.tsv
          test -s runtime-smoke/apk/artifact.tsv
          ARTIFACT_ID="$(cut -f1 runtime-smoke/apk/artifact.tsv)"
          ARTIFACT_NAME="$(cut -f2 runtime-smoke/apk/artifact.tsv)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "runtime-smoke/apk/${ARTIFACT_NAME}"
          test -s "runtime-smoke/apk/${ARTIFACT_NAME}"
          sha256sum "runtime-smoke/apk/${ARTIFACT_NAME}" > runtime-smoke/evidence/apk-sha256.txt
          echo "apk_variant=${APK_VARIANT}" > runtime-smoke/evidence/apk-variant.txt

      - name: List downloaded APK
        run: |
          find runtime-smoke/apk -maxdepth 2 -type f -name "*.apk" -print | tee runtime-smoke/apk-files.txt
          test -s runtime-smoke/apk-files.txt
          chmod +x .github/scripts/android_runtime_smoke.sh

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator install and launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/android_runtime_smoke.sh

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-smoke-evidence
          path: runtime-smoke/evidence
          if-no-files-found: warn
