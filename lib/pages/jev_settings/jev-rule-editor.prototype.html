<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev 规则编辑器 · 交互原型</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#262b2c;background:#f5f7f6;--accent:#366a60}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:28px 20px}h1{font-size:25px;margin:0 0 10px}h2{font-size:18px}p{line-height:1.7}.muted{color:#687575;font-size:14px}.panel{padding:20px;border:1px solid #d9e2dd;border-radius:15px;background:white;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}button,input,select,textarea{font:inherit}button{border:1px solid #ccd8d2;padding:9px 15px;border-radius:9px;background:white;color:inherit;cursor:pointer}button.primary,button[aria-selected=true]{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}label{display:block;margin:13px 0 6px}input:not([type=checkbox]):not([type=range]),select,textarea{width:100%;border:1px solid #bacac2;border-radius:8px;padding:10px;background:white}input[type=checkbox]{accent-color:var(--accent)}textarea{min-height:80px;resize:vertical}.rule{border-top:1px solid #e4eae7;padding:16px 0}.rule h3{font-size:16px;margin:0 0 8px}.tag{font-size:12px;padding:3px 8px;background:#edf3ef;border-radius:6px}.answer{font-size:20px;font-weight:600;color:var(--accent)}dialog{width:min(620px,94vw);max-height:90vh;border:1px solid #c4d3ca;border-radius:15px;padding:23px}dialog::backdrop{background:#15251c66}.option{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin:8px 0}.option input{min-width:0}.error{color:#aa302b}.small{font-size:13px}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f4f6f4;padding:12px}summary{cursor:pointer}#notice{min-height:24px}.walk{margin:15px 0;padding-top:15px;border-top:1px solid #e2e8e3}@media(max-width:540px){main{padding:18px 12px}.panel{padding:15px}.option{grid-template-columns:1fr 36px}.option .description{grid-column:1}.option button{grid-column:2;grid-row:1/3}}
</style>
<main>
<h1>Jev 判断规则</h1>
<p class="muted">交互原型：检验“自由写问题 → 选择预期答案 → 设置阈值 → 分场景隐藏”是否符合你的理解。所有数据仅在本页内存中；刷新即重置，不连接 Jev，也不影响应用。</p>
<div class="row" role="tablist" aria-label="规则适用场景" id="surfaces"></div>
<section class="panel"><div class="row spread"><div><h2 id="scene"></h2><p class="muted" id="scope"></p></div><button class="primary" id="add">＋ 添加规则</button></div>
<div id="builtin"></div><div id="rules"></div><div class="muted" id="notice" role="status" aria-live="polite"></div></section>
<section class="panel"><h2>试一条规则</h2><p class="muted">使用手动填入的模拟答案，查看阈值和隐藏条件。此处数值不是模型实测结果。</p>
<label for="tryRule">规则</label><select id="tryRule"></select><div id="tryFields"></div>
<label class="row"><input type="checkbox" id="failed"> 模拟请求失败或缺少有效答案</label>
<p id="result" class="answer" aria-live="polite"></p><p id="reason" class="muted"></p>
<details><summary>这条规则会怎样发送给 Jev</summary><p class="muted">仅为输入格式预览；应用会自动生成这些字段。</p><pre id="preview"></pre></details>
<div class="walk"><div class="row" role="tablist" aria-label="引导演示" id="walkTabs"></div><p id="walkText" class="muted"></p><div class="row" id="walkButtons"></div></div>
</section>
</main>
<dialog id="editor"><form id="form"><h2 id="editorTitle">添加规则</h2><p class="muted" id="editorScope"></p>
<label for="question">问题</label><textarea id="question" required placeholder="例如：这条内容是否包含剧情剧透？"></textarea>
<label for="type">答案类型</label><select id="type"><option value="noul">Yes / No</option><option value="choice">选择题</option></select>
<div id="yesFields"><label for="expected">什么答案触发隐藏</label><select id="expected"><option value="yes">Yes</option><option value="no">No</option></select><label for="yesMeaning">Yes 的含义（选填）</label><input id="yesMeaning" placeholder="例如：透露关键剧情"><label for="noMeaning">No 的含义（选填）</label><input id="noMeaning" placeholder="例如：没有透露关键剧情"></div>
<div id="choiceFields" hidden><label>自定义选项</label><p class="muted small">填写选项及其说明，勾选会触发隐藏的选项。模型只选一个答案。</p><div id="options"></div><button type="button" id="addOption">＋ 添加选项</button><div id="hideChoices"></div></div>
<label for="threshold">执行阈值：<output id="thresholdLabel">95%</output></label><input id="threshold" type="range" min="50" max="100" step="1" value="95" style="width:100%"><p class="muted small" id="thresholdHint"></p>
<label class="row"><input type="checkbox" id="enabled" checked>启用这条规则</label><p id="error" class="error" role="alert"></p>
<div class="row" style="justify-content:flex-end"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存规则</button></div></form></dialog>
<script>
// Pure protocol/decision functions. Page controls below only call these functions.
const RuleLogic = {
  validate(r){
    if(!r.question.trim()) return '请填写问题。';
    if(r.type==='choice'){
      if(r.options.length<2) return '选择题至少需要两个选项。';
      if(r.options.some(o=>!o.label.trim())) return '请填写所有选项的名称。';
      if(new Set(r.options.map(o=>o.label.trim())).size!==r.options.length) return '选项名称不能重复。';
      if(!r.hiddenOptions.length) return '至少勾选一个触发隐藏的选项。';
    }
    return '';
  },
  compile(r,surface){
    const criteria=r.type==='noul'?{'true':r.yesMeaning||'问题的回答为 Yes','false':r.noMeaning||'问题的回答为 No'}:Object.fromEntries(r.options.map(o=>[o.id,{label:o.label,description:o.description}]));
    return {state:{surface,candidates:{candidate_1:{text:'当前场景已有的最少内容'}}},questions:{candidate_1_rule_1:{type:r.type,instructions:{question:r.question,candidate:'只评估 state.candidates.candidate_1；资料不足时不要推断未提供的信息。'},criteria}}};
  },
  decide(r,a){
    if(!r.enabled) return {hide:false,reason:'规则已关闭，不执行判断。'};
    if(a.failed) return {hide:false,reason:'请求失败或缺少有效答案，保留内容。'};
    if(r.type==='noul'){
      if(!Number.isFinite(a.noul)||a.noul<0||a.noul>1) return {hide:false,reason:'Yes 概率无效，保留内容。'};
      const p=r.expected==='yes'?a.noul:1-a.noul;
      return {hide:p>=r.threshold,reason:`${r.expected==='yes'?'Yes':'No'} 概率为 ${(p*100).toFixed(0)}%，${p>=r.threshold?'达到':'未达到'} ${r.threshold*100}% 阈值。`};
    }
    if(!r.options.some(o=>o.id===a.choice)||!Number.isFinite(a.confidence)||a.confidence<0||a.confidence>1) return {hide:false,reason:'选项或置信度无效，保留内容。'};
    const matched=r.hiddenOptions.includes(a.choice), enough=a.confidence>=r.threshold;
    return {hide:matched&&enough,reason:`${matched?'答案属于隐藏选项':'答案不属于隐藏选项'}；置信度 ${(a.confidence*100).toFixed(0)}%，${enough?'达到':'未达到'} ${r.threshold*100}% 阈值。`};
  }
};
</script>
<script>
const $=id=>document.getElementById(id);
const sceneNames={video:'视频',comment:'评论',live:'直播'};
const scopes={video:'首页、相关、热门、排行、PGC、音乐推荐；沿用各入口开关。',comment:'视频详情评论正文及必要回复上下文。',live:'直播推荐卡片的标题、分区等现有内容。'};
let scene='video', seq=0, editId=null, optionDraft=[], rules={video:[],comment:[],live:[]}, builtin={video:true,live:true};
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sample(type='noul'){
  return {id:'r'+(++seq),question:type==='noul'?'这条内容是否包含剧情剧透？':'这条内容主要属于什么类型？',type,enabled:true,expected:'yes',threshold:.95,yesMeaning:'透露关键剧情',noMeaning:'没有透露关键剧情',options:[{id:'o1',label:'教程',description:'传授具体知识或操作'},{id:'o2',label:'广告',description:'主要用于推广商品或服务'},{id:'o3',label:'娱乐',description:'主要用于消遣娱乐'}],hiddenOptions:['o2','o3']};
}
function render(){
  $('surfaces').innerHTML=Object.entries(sceneNames).map(([id,label])=>`<button role="tab" aria-selected="${scene===id}" data-scene="${id}">${label}</button>`).join('');
  $('scene').textContent=sceneNames[scene]+'规则';$('scope').textContent=scopes[scene];
  $('builtin').innerHTML=scene==='comment'?'':`<div class="rule"><div class="row spread"><div><h3>根据不感兴趣主题筛选 <span class="tag">内置</span></h3><p class="muted">独立开关；任一启用规则达到阈值即可隐藏。</p></div><label class="row"><input type="checkbox" id="builtinToggle" ${builtin[scene]?'checked':''}>启用</label></div></div>`;
  if($('builtinToggle')) $('builtinToggle').onchange=e=>{builtin[scene]=e.target.checked;notice('已'+(builtin[scene]?'启用':'关闭')+'此场景内置规则。')};
  $('rules').innerHTML=rules[scene].length?rules[scene].map(r=>`<div class="rule"><div class="row spread"><h3>${escapeText(r.question)}</h3><span class="tag">${r.type==='noul'?'Yes / No':'选择题'} · ${Math.round(r.threshold*100)}%</span></div><p class="muted">隐藏条件：${r.type==='noul'?r.expected.toUpperCase():escapeText(r.options.filter(o=>r.hiddenOptions.includes(o.id)).map(o=>o.label).join('、'))}；${r.enabled?'已启用':'已关闭'}</p><div class="row"><button data-edit="${r.id}">编辑</button><button data-toggle="${r.id}">${r.enabled?'停用':'启用'}</button><button data-delete="${r.id}">删除</button></div></div>`).join(''):'<p class="muted">还没有自定义规则。添加一条，填写你想判断的问题。</p>';
  const previous=$('tryRule').value;$('tryRule').innerHTML=rules[scene].map(r=>`<option value="${r.id}">${escapeText(r.question)}</option>`).join('');if(rules[scene].some(r=>r.id===previous)) $('tryRule').value=previous;
  renderTry();
}
function notice(s){$('notice').textContent=s}
function current(){return rules[scene].find(r=>r.id===$('tryRule').value)}
function renderTry(){const r=current();$('tryFields').innerHTML=!r?'<p class="muted">请先添加规则，或使用下方引导演示。</p>':r.type==='noul'?'<label for="probability">模拟 Yes 概率（%）</label><input id="probability" type="number" min="0" max="100" value="96">':`<label for="choiceAnswer">模拟答案</label><select id="choiceAnswer">${r.options.map(o=>`<option value="${o.id}">${escapeText(o.label)}</option>`).join('')}</select><label for="confidence">模拟模型置信度（%）</label><input id="confidence" type="number" min="0" max="100" value="96">`;
  $('tryFields').querySelectorAll('input,select').forEach(e=>e.oninput=run);run();
}
function run(){const r=current();if(!r){$('result').textContent='尚未选择规则';$('reason').textContent='';$('preview').textContent='';return}const a={failed:$('failed').checked,noul:$('probability')?.value===''?NaN:Number($('probability')?.value)/100,choice:$('choiceAnswer')?.value,confidence:$('confidence')?.value===''?NaN:Number($('confidence')?.value)/100};const d=RuleLogic.decide(r,a);$('result').textContent=d.hide?'隐藏内容':'保留内容';$('reason').textContent=d.reason;$('preview').textContent=JSON.stringify(RuleLogic.compile(r,scene),null,2)}
function typeChange(){$('yesFields').hidden=$('type').value!=='noul';$('choiceFields').hidden=$('type').value!=='choice';$('thresholdHint').textContent=$('type').value==='noul'?'选择 Yes 时使用 Yes 概率；选择 No 时使用 No 概率。':'仅当返回选项在隐藏集合内，且模型置信度达标才隐藏。'}
function renderOptions(){
  $('options').innerHTML=optionDraft.map(o=>`<div class="option"><input aria-label="选项名称" data-label="${o.id}" value="${escapeText(o.label)}" placeholder="选项名称"><input class="description" aria-label="选项说明" data-description="${o.id}" value="${escapeText(o.description)}" placeholder="含义说明（选填）"><button type="button" data-remove-option="${o.id}" aria-label="删除选项">×</button></div>`).join('');renderChecks();
}
function renderChecks(){$('hideChoices').innerHTML='<label>选到哪些答案时隐藏</label>'+optionDraft.map(o=>`<label class="row"><input type="checkbox" data-hide-option="${o.id}" ${o.hide?'checked':''}>${escapeText(o.label||'未命名选项')}</label>`).join('')}
function openEditor(r){editId=r?.id??null;r=r??{...sample(),question:'',yesMeaning:'',noMeaning:''};$('editorTitle').textContent=editId?'编辑规则':'添加规则';$('editorScope').textContent='适用于'+sceneNames[scene]+'；取消不会修改已保存的规则。';$('question').value=r.question;$('type').value=r.type;$('expected').value=r.expected;$('yesMeaning').value=r.yesMeaning;$('noMeaning').value=r.noMeaning;$('threshold').value=r.threshold*100;$('thresholdLabel').textContent=Math.round(r.threshold*100)+'%';$('enabled').checked=r.enabled;optionDraft=r.options.map(o=>({...o,hide:r.hiddenOptions.includes(o.id)}));$('error').textContent='';typeChange();renderOptions();$('editor').showModal()}
$('surfaces').onclick=e=>{if(e.target.dataset.scene){scene=e.target.dataset.scene;notice('');render()}};
$('rules').onclick=e=>{const r=rules[scene].find(r=>r.id===(e.target.dataset.edit||e.target.dataset.toggle||e.target.dataset.delete));if(!r)return;if(e.target.dataset.edit)openEditor(r);if(e.target.dataset.toggle){r.enabled=!r.enabled;render();notice('已更新规则开关。')}if(e.target.dataset.delete){rules[scene]=rules[scene].filter(x=>x!==r);render();notice('规则已删除。')}};
$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('type').onchange=typeChange;$('threshold').oninput=()=>$('thresholdLabel').textContent=$('threshold').value+'%';
$('options').oninput=e=>{const o=optionDraft.find(o=>o.id===(e.target.dataset.label||e.target.dataset.description));if(o){if(e.target.dataset.label){o.label=e.target.value;renderChecks()}else o.description=e.target.value}};
$('options').onclick=e=>{if(e.target.dataset.removeOption){optionDraft=optionDraft.filter(o=>o.id!==e.target.dataset.removeOption);renderOptions()}};
$('hideChoices').onchange=e=>{const o=optionDraft.find(o=>o.id===e.target.dataset.hideOption);if(o)o.hide=e.target.checked};
$('addOption').onclick=()=>{optionDraft.push({id:'o'+(++seq+100),label:'',description:'',hide:false});renderOptions()};
$('form').onsubmit=e=>{e.preventDefault();const r={id:editId||'r'+(++seq),question:$('question').value.trim(),type:$('type').value,expected:$('expected').value,yesMeaning:$('yesMeaning').value.trim(),noMeaning:$('noMeaning').value.trim(),threshold:Number($('threshold').value)/100,enabled:$('enabled').checked,options:optionDraft.map(({id,label,description})=>({id,label:label.trim(),description:description.trim()})),hiddenOptions:optionDraft.filter(o=>o.hide).map(o=>o.id)};const error=RuleLogic.validate(r);if(error){$('error').textContent=error;return}if(editId)rules[scene]=rules[scene].map(x=>x.id===editId?r:x);else rules[scene].push(r);$('editor').close();render();$('tryRule').value=r.id;renderTry();notice('已保存'+sceneNames[scene]+'规则；其他场景不变。')};
$('tryRule').onchange=renderTry;$('failed').onchange=run;
const walks={threshold:{label:'阈值边界',text:'只看当前自定义规则：先创建剧透规则，再比较 94% 与 95%。',steps:[['创建样例',()=>setup('noul')],['概率 94%',()=>setProbability(94)],['概率 95%',()=>setProbability(95)]]},choice:{label:'多个隐藏选项',text:'模型仍然单选：教程保留，广告或娱乐达到阈值时隐藏。',steps:[['创建选择题',()=>setup('choice')],['返回广告',()=>setChoice('o2')],['返回娱乐',()=>setChoice('o3')],['返回教程',()=>setChoice('o1')]]},failure:{label:'失败保留',text:'模拟有把握的 Yes，然后模拟请求失败：这条规则不能隐藏内容。',steps:[['创建样例',()=>setup('noul')],['请求失败',()=>{$('failed').checked=true;run()}],['恢复有效答案',()=>{$('failed').checked=false;run()}]]}};
function setup(type){rules={video:[],comment:[],live:[]};scene='video';builtin={video:false,live:false};rules.video.push(sample(type));$('failed').checked=false;render();notice('引导演示已重置；内置规则关闭，便于观察当前规则。')}
function setProbability(n){if($('probability')){$('probability').value=n;run()}}
function setChoice(id){if($('choiceAnswer')){$('choiceAnswer').value=id;run()}}
function walk(id){$('walkTabs').innerHTML=Object.entries(walks).map(([key,w])=>`<button role="tab" aria-selected="${key===id}" data-walk="${key}">${w.label}</button>`).join('');$('walkText').textContent=walks[id].text+' 第一步会重置原型内存中的全部样例。';$('walkButtons').innerHTML='';walks[id].steps.forEach(([label,action])=>{const b=document.createElement('button');b.textContent=label;b.onclick=action;$('walkButtons').append(b)})}
$('walkTabs').onclick=e=>{if(e.target.dataset.walk)walk(e.target.dataset.walk)};
render();walk('threshold');
</script>
</html>
